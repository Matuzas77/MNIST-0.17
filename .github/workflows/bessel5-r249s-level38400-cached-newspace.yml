name: BESSEL5 R249S cached exact level-38400 newspace census

on:
  pull_request:
    branches:
      - master
    paths:
      - bessel5_r249s_cached_newspace.py
      - .github/workflows/bessel5-r249s-level38400-cached-newspace.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SAGE_IMAGE: sagemath/sagemath@sha256:e068670ae5863b54b2550e72437ec637b0283acb0dc712c8584c124dbf44e667

jobs:
  cache-smoke-level600:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out isolated public computation branch
        uses: actions/checkout@v4

      - name: Reclaim disk and pull pinned SageMath
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          docker pull "$SAGE_IMAGE"
          docker image inspect "$SAGE_IMAGE" --format '{{json .RepoDigests}}' > sage_image_digest.txt

      - name: Run exact cached all-prime level-600 smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=r249_level600_q101
          rm -rf "$OUT"
          mkdir -p "$OUT"
          chmod 777 "$OUT"
          cp bessel5_r249s_cached_newspace.py sage_image_digest.txt "$OUT/"
          /usr/bin/time -v docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e SAGE_VERSION=10.9 \
            "$SAGE_IMAGE" \
            sage -python bessel5_r249s_cached_newspace.py \
              --level 600 \
              --prime 101 \
              --expected-new-dimension 38 \
              --outdir "$OUT" \
            2>&1 | tee "$OUT/docker_output.txt"
          test -f "$OUT/SUCCESS"
          grep -Fxq PASS "$OUT/SUCCESS"
          grep -Fq 'NEWSPACE_END dimension=38' "$OUT/docker_output.txt"
          grep -Fq 'CACHE_REUSE=true' "$OUT/docker_output.txt"
          grep -Fq 'PLUS8_RANK_END rank=38 nullity=0' "$OUT/docker_output.txt"
          grep -Fq 'MINUS8_RANK_END rank=38 nullity=0' "$OUT/docker_output.txt"
          grep -Fq 'verdict=NO_GO_AT_P7_ON_EXACT_NEWSPACE' "$OUT/docker_output.txt"
          grep -Fq 'SELF_CHECK=PASS' "$OUT/docker_output.txt"

      - name: Record smoke hashes and environment
        if: always()
        shell: bash
        run: |
          OUT=r249_level600_q101
          mkdir -p "$OUT"
          free -h > "$OUT/memory_after.txt" || true
          df -h / > "$OUT/disk_after.txt" || true
          uname -a > "$OUT/uname.txt" || true
          find "$OUT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS" || true
          cat "$OUT/SHA256SUMS" || true

      - name: Upload level-600 cache certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BESSEL5_R249S_LEVEL600_CACHED_NEWSPACE_CERTIFICATE
          path: r249_level600_q101/
          if-no-files-found: warn
          retention-days: 30

  exact-level38400-q101:
    needs: cache-smoke-level600
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out isolated public computation branch
        uses: actions/checkout@v4

      - name: Reclaim disk and pull pinned SageMath
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          df -h /
          docker pull "$SAGE_IMAGE"
          docker image inspect "$SAGE_IMAGE" --format '{{json .RepoDigests}}' > sage_image_digest.txt
          df -h /

      - name: Provision auxiliary swap
        shell: bash
        run: |
          set -euo pipefail
          AVAIL_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          SWAP_GB=$((AVAIL_GB - 9))
          if [ "$SWAP_GB" -gt 24 ]; then SWAP_GB=24; fi
          if [ "$SWAP_GB" -lt 8 ]; then SWAP_GB=8; fi
          AUX_SWAP=/mnt/r249-level38400.swap
          sudo rm -f "$AUX_SWAP"
          sudo fallocate -l "${SWAP_GB}G" "$AUX_SWAP"
          sudo chmod 600 "$AUX_SWAP"
          sudo mkswap "$AUX_SWAP"
          sudo swapon "$AUX_SWAP"
          echo "AUX_SWAP_GB=$SWAP_GB" | tee auxiliary_swap.txt
          free -h
          df -h /

      - name: Run exact cached all-prime level-38400 census
        shell: bash
        run: |
          set -euo pipefail
          OUT=r249_level38400_q101
          rm -rf "$OUT"
          mkdir -p "$OUT"
          chmod 777 "$OUT"
          cp bessel5_r249s_cached_newspace.py sage_image_digest.txt auxiliary_swap.txt "$OUT/"
          /usr/bin/time -v docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e SAGE_VERSION=10.9 \
            -e SAGE_NUM_THREADS=2 \
            "$SAGE_IMAGE" \
            sage -python bessel5_r249s_cached_newspace.py \
              --level 38400 \
              --prime 101 \
              --expected-new-dimension 2432 \
              --outdir "$OUT" \
            2>&1 | tee "$OUT/docker_output.txt"
          test -f "$OUT/SUCCESS"
          grep -Fxq PASS "$OUT/SUCCESS"
          grep -Fq 'NEWSPACE_END dimension=2432' "$OUT/docker_output.txt"
          grep -Fq 'CACHE_REUSE=true' "$OUT/docker_output.txt"
          grep -Fq 'SELF_CHECK=PASS' "$OUT/docker_output.txt"

      - name: Record exact hashes and environment
        if: always()
        shell: bash
        run: |
          OUT=r249_level38400_q101
          mkdir -p "$OUT"
          free -h > "$OUT/memory_after.txt" || true
          df -h / > "$OUT/disk_after.txt" || true
          uname -a > "$OUT/uname.txt" || true
          find "$OUT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS" || true
          cat "$OUT/checkpoint.json" || true
          cat "$OUT/result.json" || true
          cat "$OUT/SHA256SUMS" || true

      - name: Upload exact level-38400 certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BESSEL5_R249S_LEVEL38400_Q101_CACHED_NEWSPACE_CERTIFICATE
          path: r249_level38400_q101/
          if-no-files-found: warn
          retention-days: 30
